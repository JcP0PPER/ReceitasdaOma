services:
  mongodb:
    image: mongo:7
    container_name: receitas-oma-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - dados-mongo:/data/db

  restheart:
    image: softinstigate/restheart:8
    container_name: receitas-oma-restheart
    depends_on:
      - mongodb
    restart: unless-stopped
    environment:
      RHO: '/mclient/connection-string->"mongodb://mongodb:27017";/http listener/host->"0.0.0.0"'
    ports:
      - "8080:8080"

  frontend:
    image: nginx:alpine
    container_name: receitas-oma-frontend
    depends_on:
      - restheart
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  dados-mongo:
